# Tiny Tapeout project information
project:
  title:        "Moonlight Sonata player (VGA)"      # Project title
  author:       "MPriede"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Plays the Moonlight Sonata, 3rd movement, bars 1-37 and the final cadence (bars 200-201, 61 s, 388 notes), as a soft triangle tone with a piano-like envelope (1-bit sigma-delta audio), and shows each note on a VGA screen as a green bar that follows the sound."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25175000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_mpriede_moonlight_sonata_player_vga"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "half speed"
  ui[1]: ""
  ui[2]: ""
  ui[3]: "loop off"
  ui[4]: ""
  ui[5]: "viewer mode: player step on 1 clock in 100 (for a slow VGA s"
  ui[6]: "fast mode: player step on every clock (100 kHz board clock)"
  ui[7]: "pause (high) / play (low)"

  # Outputs
  uo[0]: "R1 (VGA red, high bit, always 0)"
  uo[1]: "G1 (VGA green, high bit)"
  uo[2]: "B1 (VGA blue, high bit)"
  uo[3]: "vsync"
  uo[4]: "R0 (VGA red, low bit, always 0)"
  uo[5]: "G0 (VGA green, low bit)"
  uo[6]: "B0 (VGA blue, low bit)"
  uo[7]: "hsync"

  # Bidirectional pins
  uio[0]: "audio out (1-bit sigma-delta, RC filter)"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: "audio out (audio PMOD, same as uio[0])"

# Do not change!
yaml_version: 6
